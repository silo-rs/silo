[workspace]
members = ["crates/*"]
exclude = ["crates/silo-ebpf"]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2024"
authors = ["Jun Ryu <junhsss@gmail.com>"]
description = "Transparent port isolation for parallel development"
license = "MIT"
repository = "https://github.com/silo-rs/silo"
homepage = "https://github.com/silo-rs/silo"

[workspace.dependencies]
# silo deps
eyre = "0.6"
thiserror = "2"
colored = "3"
dirs = "6"
which = "8"
tracing = "0.1"
fd-lock = "4"

# silo-cli deps
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# silo-bind deps
libc = "0.2"

# ebpf deps
aya = "0.13"

# dev deps
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
