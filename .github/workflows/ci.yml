name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete
      - uses: crate-ci/typos@master

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p silo-bind
      - run: cargo nextest run --workspace

  careful:
    name: Careful
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-careful
      - run: cargo +nightly careful build -p silo-bind
      - run: cargo +nightly careful test -p silo-bind

  build-ebpf:
    name: Build eBPF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install bpf-linker
        run: cargo +nightly install bpf-linker
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly build --manifest-path crates/silo-ebpf/Cargo.toml --target bpfel-unknown-none -Z build-std=core

  test-ebpf:
    name: Test eBPF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install bpf-linker
        run: cargo +nightly install bpf-linker
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p silo-bind
      - name: Build eBPF tests
        run: cargo test -p silo-ebpf-tests --no-run --message-format=json 2>/tmp/ebpf-build.log | tee /tmp/ebpf-build.json
      - name: Show eBPF build log
        if: always()
        run: cat /tmp/ebpf-build.log || true
      - name: Run eBPF tests as root
        run: |
          TEST_BIN=$(jq -r 'select(.executable != null and (.target.kind | contains(["test"]))) | .executable' /tmp/ebpf-build.json | head -1)
          echo "Test binary: $TEST_BIN"
          test -n "$TEST_BIN" || { echo "ERROR: no test binary found"; exit 1; }
          sudo -E "$TEST_BIN" --test-threads=1

  test-linux-distros:
    name: Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:latest
            setup: dnf install -y gcc git curl iproute
          - distro: archlinux
            image: archlinux:latest
            setup: pacman -Sy --noconfirm gcc git curl iproute2
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install system deps
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v7
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Build and test
        run: |
          . "$HOME/.cargo/env"
          cargo build -p silo-bind
          cargo test --workspace
      - name: Verify ip command detection
        run: |
          . "$HOME/.cargo/env"
          ip_path=$(command -v ip)
          echo "ip command at: $ip_path"
          # Verify our detection logic finds the same path
          cargo test -p silo -- ip::tests::admin_group --nocapture
