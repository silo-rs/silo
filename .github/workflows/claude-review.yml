name: Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  review:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Collapse prior review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .node_id' \
          | while read -r node_id; do
              [ -z "$node_id" ] && continue
              gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }' -f id="$node_id"
            done

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: ""
          prompt: |
            Review this PR. Focus only on things that matter:
            - Correctness and potential bugs
            - Safety of unsafe code in silo-bind
            - Whether #![forbid(unsafe_code)] is respected in crates/silo

            CI has already passed. Do not check formatting or clippy — those are covered.
            Be concise. Skip praise. If everything looks good, say so in one line.
          use_sticky_comment: true
